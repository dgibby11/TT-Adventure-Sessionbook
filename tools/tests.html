<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TT Adventure Sessionbook — JS Tests</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #0e0c09; color: #c8b89a; padding: 2rem; }
    h1 { font-size: 0.95rem; color: #c9a227; margin-bottom: 1.5rem;
         letter-spacing: 0.12em; text-transform: uppercase; }
    .section { margin-top: 1.2rem; margin-bottom: 0.4rem; color: #6a5c4a;
               font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; }
    .result { font-size: 0.82rem; line-height: 1.6; white-space: pre; }
    .pass  { color: #5a9a5a; }
    .fail  { color: #c04040; }
    .summary { margin-top: 1.5rem; padding-top: 1rem;
               border-top: 1px solid #2a2520; font-size: 0.88rem; }
    .clean { color: #5a9a5a; }
    .dirty { color: #c04040; }
  </style>
</head>
<body>
  <h1>TT Adventure Sessionbook &mdash; JS Unit Tests</h1>
  <div id="output"></div>

  <!-- Mocks must be set before the modules load -->
  <script>
    window.CAMPAIGN  = { id: 'test', storageKey: 'test.generated.v1' };
    window.ENTITIES  = [];
    window.App = {
      byId:        (id) => _mockEntities[id] || undefined,
      isDM:        () => false,
      isVisible:   () => true,
      getNote:     () => '',
      setNote:     () => {},
      isRevealed:  () => false,
      setRevealed: () => {},
    };

    // Mock entity registry for modal cross-link tests (and, for state.js, two
    // locations the party can be moved between)
    const _mockEntities = {
      known_npc: { id: 'known_npc', name: 'Tara Brightstone', type: 'npc', visibility: 'player' },
      loc_a:     { id: 'loc_a', name: 'Alpha Hall',  type: 'location', visibility: 'player' },
      loc_b:     { id: 'loc_b', name: 'Bravo Field', type: 'location', visibility: 'player' },
    };

    // state.js reads its saved state once, at script load — start it empty so
    // a previous run of this page cannot leak into this one.
    localStorage.removeItem(window.CAMPAIGN.storageKey);
  </script>
  <script src="/js/generator.js"></script>
  <script src="/js/modal.js"></script>
  <!-- state.js adds the real party/location functions onto the mock App above -->
  <script src="/js/state.js"></script>
  <script src="/js/dashboard.js"></script>

  <script>
    // ── Framework ─────────────────────────────────────────────────────────────
    const out = document.getElementById('output');
    let passes = 0, failures = 0;

    function section(label) {
      const el = document.createElement('div');
      el.className = 'section';
      el.textContent = label;
      out.appendChild(el);
    }

    function log(ok, name, detail) {
      const el = document.createElement('div');
      el.className = 'result ' + (ok ? 'pass' : 'fail');
      const prefix = ok ? 'PASS  ' : 'FAIL  ';
      el.textContent = prefix + name + (detail ? '  (' + detail + ')' : '');
      out.appendChild(el);
    }

    function test(name, fn) {
      try {
        fn();
        passes++;
        log(true, name);
      } catch (e) {
        failures++;
        log(false, name, e.message);
      }
    }

    function assert(cond, msg)       { if (!cond) throw new Error(msg || 'assertion failed'); }
    function assertEqual(a, b, msg)  { if (a !== b) throw new Error(msg || `expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); }

    // ── generator.js tests ────────────────────────────────────────────────────
    const G = window._genTest;

    if (!G) {
      failures++;
      log(false, 'window._genTest export', 'not found — check generator.js for errors');
    } else {

      section('generateNPC() — structure');

      test('returns object with all required entity fields', () => {
        const npc = G.generateNPC();
        assert(npc.id.startsWith('gen_npc_'), `id "${npc.id}" should start with gen_npc_`);
        assertEqual(npc.type, 'npc');
        assertEqual(npc.contentType, 'inline');
        assertEqual(npc.visibility, 'dm-only');
        assert(typeof npc.name === 'string' && npc.name.length > 0, 'name must be non-empty string');
        assert(typeof npc.content === 'string' && npc.content.includes('<article'), 'content must contain <article>');
        assert(Array.isArray(npc.tags) && npc.tags.includes('generated'), 'tags must include "generated"');
      });

      test('_meta contains race, gender, alignment', () => {
        const npc = G.generateNPC();
        assert(npc._meta && typeof npc._meta.race === 'string', '_meta.race missing');
        assert(typeof npc._meta.gender === 'string', '_meta.gender missing');
        assert(typeof npc._meta.alignment === 'string', '_meta.alignment missing');
      });

      test('generates unique ids on 20 repeated calls', () => {
        const ids = new Set(Array.from({ length: 20 }, () => G.generateNPC().id));
        assertEqual(ids.size, 20, 'all 20 NPCs must have distinct ids');
      });

      section('generateNPC() — seeding');

      test('name seed overrides random name', () => {
        const npc = G.generateNPC({ name: 'Alice Testwood' });
        assertEqual(npc.name, 'Alice Testwood');
      });

      test('seeded name appears in content HTML', () => {
        const npc = G.generateNPC({ name: 'Zephyr Coldmere' });
        assert(npc.content.includes('Zephyr Coldmere'), 'seeded name should appear in content');
      });

      test('gender seed Male → he/him pronouns', () => {
        const npc = G.generateNPC({ gender: 'Male' });
        assertEqual(npc._meta.gender, 'Male');
        assert(/\bHe\b/.test(npc.content), 'content should contain "He"');
      });

      test('gender seed Female → she/her pronouns', () => {
        const npc = G.generateNPC({ gender: 'Female' });
        assertEqual(npc._meta.gender, 'Female');
        assert(/\bShe\b/.test(npc.content), 'content should contain "She"');
      });

      test('race seed Human recorded in _meta', () => {
        const npc = G.generateNPC({ race: 'Human' });
        assertEqual(npc._meta.race, 'Human');
      });

      section('generateNPC() — probabilistic');

      test('secrets appear occasionally (25% chance) over 200 rolls', () => {
        const results = Array.from({ length: 200 }, () => G.generateNPC());
        const withSecret = results.filter(n => n.content.includes('Secret (DM Only)')).length;
        assert(withSecret > 0,   'secret should appear at least once in 200 rolls');
        assert(withSecret < 200, 'secret should sometimes be absent');
      });

      section('rollOccupation()');

      test('returns object with non-empty category and role', () => {
        const occ = G.rollOccupation();
        assert(typeof occ.category === 'string' && occ.category.length > 0, 'category must be non-empty');
        assert(typeof occ.role === 'string' && occ.role.length > 0, 'role must be non-empty');
      });

      test('category always exists in T.occupations (50 rolls)', () => {
        const cats = Object.keys(G.T.occupations);
        for (let i = 0; i < 50; i++) {
          const occ = G.rollOccupation();
          assert(cats.includes(occ.category), `"${occ.category}" not in T.occupations`);
        }
      });

      test('role always exists in its category array (50 rolls)', () => {
        for (let i = 0; i < 50; i++) {
          const occ = G.rollOccupation();
          const roles = G.T.occupations[occ.category];
          assert(roles.includes(occ.role), `"${occ.role}" not in category "${occ.category}"`);
        }
      });

      test('service/laborer/artisan outnumber noble/arcane over 500 rolls', () => {
        const counts = {};
        for (let i = 0; i < 500; i++) {
          const { category } = G.rollOccupation();
          counts[category] = (counts[category] || 0) + 1;
        }
        const common = (counts['Service'] || 0) + (counts['Laborer'] || 0) + (counts['Artisan'] || 0);
        const rare   = (counts['Noble']   || 0) + (counts['Arcane']  || 0);
        assert(common > rare * 3, `common (${common}) should greatly outnumber rare (${rare})`);
      });

      section('generateItem()');

      test('returns object with required entity fields', () => {
        const item = G.generateItem();
        assert(item.id.startsWith('gen_item_'), `id "${item.id}" should start with gen_item_`);
        assertEqual(item.type, 'item');
        assertEqual(item.contentType, 'inline');
        assert(typeof item.name === 'string' && item.name.length > 0, 'name must be non-empty');
        assert(item.content.includes('<article'), 'content must contain <article>');
      });

      test('rarity always one of the four tiers (20 rolls)', () => {
        const valid = new Set(['Common', 'Uncommon', 'Rare', 'Very Rare']);
        for (let i = 0; i < 20; i++) {
          const item = G.generateItem();
          assert(valid.has(item._meta.rarity), `"${item._meta.rarity}" is not a valid rarity`);
        }
      });

      // mergeExt tests come last — they mutate G.T
      section('mergeExt() — run last (mutates T)');

      test('_merge:true appends to existing arrays', () => {
        const before = G.T.traits.length;
        G.mergeExt({ _merge: true, traits: ['__test_trait__'] });
        assert(G.T.traits.length > before, 'traits array should have grown');
        assert(G.T.traits.includes('__test_trait__'), '__test_trait__ should be present');
      });

      test('_merge:false replaces arrays entirely', () => {
        G.mergeExt({ _merge: false, traits: ['__only_trait__'] });
        assertEqual(G.T.traits.length, 1, 'array should be fully replaced');
        assertEqual(G.T.traits[0], '__only_trait__');
      });

      test('_-prefixed keys are never written to T', () => {
        G.mergeExt({ _merge: true, _comment: 'should be ignored', traits: ['__extra__'] });
        assert(!('_comment' in G.T), 'T must not have a _comment key');
      });

      test('adds new occupation categories with _merge:true', () => {
        G.mergeExt({ _merge: true, occupations: { '__TestCat__': ['__TestRole__'] } });
        assert('__TestCat__' in G.T.occupations, '__TestCat__ should be added');
        assert(G.T.occupations['__TestCat__'].includes('__TestRole__'), '__TestRole__ should be in category');
      });

    } // end G tests

    // ── modal.js tests ────────────────────────────────────────────────────────
    const M = window._modalTest;

    if (!M) {
      failures++;
      log(false, 'window._modalTest export', 'not found — check modal.js for errors');
    } else {

      section('cross-links — makeLink()');

      test('known id → <a> element with entity name', () => {
        const el = M.makeLink('known_npc', null);
        assertEqual(el.tagName, 'A', 'should be an anchor element');
        assertEqual(el.textContent, 'Tara Brightstone', 'text should be entity name');
      });

      test('known id with custom label → <a> showing label text', () => {
        const el = M.makeLink('known_npc', 'Dr. Tara');
        assertEqual(el.tagName, 'A', 'should be an anchor element');
        assertEqual(el.textContent, 'Dr. Tara', 'custom label should override entity name');
      });

      test('unknown id → <span class="xlink-broken">', () => {
        const el = M.makeLink('no_such_entity', null);
        assertEqual(el.tagName, 'SPAN', 'broken link should be a span');
        assert(el.className.includes('xlink-broken'), `class "${el.className}" should include xlink-broken`);
      });

      test('unknown id with label → broken span shows label text, not id', () => {
        const el = M.makeLink('no_such_entity', 'The Hidden One');
        assertEqual(el.textContent, 'The Hidden One', 'label should be shown even for broken links');
      });

      section('cross-links — resolveCrossLinks()');

      test('[[id]] token replaced by link with entity name', () => {
        const div = document.createElement('div');
        div.textContent = 'She spoke to [[known_npc]] yesterday.';
        M.resolveCrossLinks(div);
        const a = div.querySelector('a');
        assert(a !== null, 'should contain an <a> element');
        assertEqual(a.textContent, 'Tara Brightstone');
      });

      test('[[id|label]] token replaced by link with custom label', () => {
        const div = document.createElement('div');
        div.textContent = 'She is known as [[known_npc|the Scholar]].';
        M.resolveCrossLinks(div);
        const a = div.querySelector('a');
        assert(a !== null, 'should contain an <a> element');
        assertEqual(a.textContent, 'the Scholar');
      });

      test('[[broken_id]] token replaced by broken-link span (not omitted)', () => {
        const div = document.createElement('div');
        div.textContent = 'She visited [[ghost_tower]].';
        M.resolveCrossLinks(div);
        const span = div.querySelector('.xlink-broken');
        assert(span !== null, 'broken link span must be present — not silently dropped');
      });

      test('surrounding text preserved after cross-link replacement', () => {
        const div = document.createElement('div');
        div.textContent = 'Before [[known_npc]] after.';
        M.resolveCrossLinks(div);
        assert(div.textContent.includes('Before'), 'text before link should be preserved');
        assert(div.textContent.includes('after.'), 'text after link should be preserved');
      });

    } // end M tests

    // ── wireZoom tests ────────────────────────────────────────────────────────
    section('wireZoom() -- API and scale clamping');

    (function () {
      // Build a minimal container + img pair
      function makeFixture() {
        const container = document.createElement('div');
        const img       = document.createElement('img');
        container.appendChild(img);
        document.body.appendChild(container);   // must be in DOM for event dispatch
        return { container, img, cleanup: () => container.remove() };
      }

      function parseScale(transform) {
        // extract scale(N) from "translate(Xpx,Ypx) scale(N)"
        const m = transform.match(/scale\(([^)]+)\)/);
        return m ? parseFloat(m[1]) : 1;
      }

      test('wireZoom returns { reset, zoomBy }', () => {
        const { container, img, cleanup } = makeFixture();
        const ctrl = M.wireZoom(container, img);
        assert(typeof ctrl.reset  === 'function', 'reset should be a function');
        assert(typeof ctrl.zoomBy === 'function', 'zoomBy should be a function');
        cleanup();
      });

      test('initial transform is scale(1)', () => {
        const { container, img, cleanup } = makeFixture();
        M.wireZoom(container, img);
        assertEqual(parseScale(img.style.transform), 1);
        cleanup();
      });

      test('zoomBy(2) doubles the scale', () => {
        const { container, img, cleanup } = makeFixture();
        const ctrl = M.wireZoom(container, img);
        ctrl.zoomBy(2);
        assertEqual(parseScale(img.style.transform), 2);
        cleanup();
      });

      test('zoomBy compounds: 2x then 2x = 4x', () => {
        const { container, img, cleanup } = makeFixture();
        const ctrl = M.wireZoom(container, img);
        ctrl.zoomBy(2);
        ctrl.zoomBy(2);
        assert(Math.abs(parseScale(img.style.transform) - 4) < 0.001, 'scale should be ~4');
        cleanup();
      });

      test('scale clamps at MAX (8)', () => {
        const { container, img, cleanup } = makeFixture();
        const ctrl = M.wireZoom(container, img);
        ctrl.zoomBy(1000);
        assertEqual(parseScale(img.style.transform), 8, 'scale must not exceed 8');
        cleanup();
      });

      test('scale clamps at MIN (0.25)', () => {
        const { container, img, cleanup } = makeFixture();
        const ctrl = M.wireZoom(container, img);
        ctrl.zoomBy(0.0001);
        assertEqual(parseScale(img.style.transform), 0.25, 'scale must not go below 0.25');
        cleanup();
      });

      test('reset() restores scale to 1', () => {
        const { container, img, cleanup } = makeFixture();
        const ctrl = M.wireZoom(container, img);
        ctrl.zoomBy(3);
        ctrl.reset();
        assertEqual(parseScale(img.style.transform), 1, 'reset should restore scale to 1');
        cleanup();
      });

      test('img.draggable is false after wireZoom', () => {
        const { container, img, cleanup } = makeFixture();
        M.wireZoom(container, img);
        assertEqual(img.draggable, false);
        cleanup();
      });

      test('cursor is zoom-in at scale 1', () => {
        const { container, img, cleanup } = makeFixture();
        M.wireZoom(container, img);
        assertEqual(img.style.cursor, 'zoom-in');
        cleanup();
      });

      test('cursor is grab when scale > 1', () => {
        const { container, img, cleanup } = makeFixture();
        const ctrl = M.wireZoom(container, img);
        ctrl.zoomBy(2);
        assertEqual(img.style.cursor, 'grab');
        cleanup();
      });
    })();

    section('openImageModal() / closeImageModal()');

    test('openImageModal creates #img-overlay in DOM', () => {
      window.openImageModal('test.jpg', 'Test Image');
      const el = document.getElementById('img-overlay');
      assert(el !== null, '#img-overlay should exist after first call');
    });

    test('openImageModal sets title text', () => {
      window.openImageModal('test.jpg', 'My Map');
      const title = document.getElementById('img-modal-title');
      assertEqual(title.textContent, 'My Map');
    });

    test('openImageModal sets image src', () => {
      window.openImageModal('region_map.jpg', 'Region');
      const img = document.getElementById('img-modal-img');
      assert(img.src.endsWith('region_map.jpg'), 'img src should end with region_map.jpg');
    });

    test('overlay is visible after openImageModal', () => {
      window.openImageModal('test.jpg', 'Test');
      const el = document.getElementById('img-overlay');
      assertEqual(el.hidden, false, 'overlay should not be hidden');
    });

    test('Escape key closes the image modal', () => {
      window.openImageModal('test.jpg', 'Test');
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      const el = document.getElementById('img-overlay');
      assertEqual(el.hidden, true, 'overlay should be hidden after Escape');
    });

    test('zoom buttons exist inside image modal', () => {
      window.openImageModal('test.jpg', 'Test');
      assert(document.getElementById('img-btn-in')    !== null, '#img-btn-in missing');
      assert(document.getElementById('img-btn-out')   !== null, '#img-btn-out missing');
      assert(document.getElementById('img-btn-reset') !== null, '#img-btn-reset missing');
    });

    // ── dashboard.js — region model ───────────────────────────────────────────
    const D = window._dashTest;

    if (!D) {
      failures++;
      log(false, 'window._dashTest export', 'not found — check dashboard.js for errors');
    } else {
      const loc = (id, related, extra) =>
        Object.assign({ id, name: id.toUpperCase(), type: 'location', related: related || [] }, extra);
      const npc = (id, related) => ({ id, name: id, type: 'npc', related: related || [] });
      const regionOf = (model, id) => model.regionOf.get(id);

      section('buildRegionModel() — region list');

      test('regions come back in config order', () => {
        const m = D.buildRegionModel([loc('a'), loc('b'), loc('c')], ['c', 'a', 'b']);
        assertEqual(m.regions.map((r) => r.id).join(','), 'c,a,b');
      });

      test('a region may be a bare id or { id, label }', () => {
        const m = D.buildRegionModel([loc('a'), loc('b')], ['a', { id: 'b', label: 'The Far Side' }]);
        assertEqual(m.regions[0].label, 'A', 'bare id takes the hub entity name');
        assertEqual(m.regions[1].label, 'The Far Side', 'label overrides the hub name');
      });

      test('{ id } with no label falls back to the hub name', () => {
        const m = D.buildRegionModel([loc('a')], [{ id: 'a' }]);
        assertEqual(m.regions[0].label, 'A');
      });

      test('unknown hub ids are dropped, not thrown on', () => {
        const m = D.buildRegionModel([loc('a')], ['nope', 'a', null, {}]);
        assertEqual(m.regions.length, 1);
        assertEqual(m.regions[0].id, 'a');
      });

      test('a hub that is not a location is dropped', () => {
        const m = D.buildRegionModel([loc('a'), npc('n')], ['n', 'a']);
        assertEqual(m.regions.map((r) => r.id).join(','), 'a');
      });

      test('a hub listed twice makes one region', () => {
        const m = D.buildRegionModel([loc('a')], ['a', { id: 'a', label: 'Again' }]);
        assertEqual(m.regions.length, 1);
        assertEqual(m.regions[0].label, 'A', 'the first mention wins');
      });

      test('no regions configured → empty list, nothing thrown', () => {
        for (const cfg of [undefined, null, []]) {
          const m = D.buildRegionModel([loc('a')], cfg);
          assertEqual(m.regions.length, 0);
          assertEqual(m.orphans.length, 1, 'with no hubs every location is unplaced');
        }
      });

      section('buildRegionModel() — membership');

      test('a hub belongs to its own region', () => {
        const m = D.buildRegionModel([loc('a')], ['a']);
        assertEqual(regionOf(m, 'a'), 'a');
      });

      test('a location the hub links to joins that region', () => {
        const m = D.buildRegionModel([loc('a', ['x']), loc('x')], ['a']);
        assertEqual(regionOf(m, 'x'), 'a');
      });

      test('a location that links TO the hub joins too (links count both ways)', () => {
        const m = D.buildRegionModel([loc('a'), loc('x', ['a'])], ['a']);
        assertEqual(regionOf(m, 'x'), 'a');
      });

      test('membership follows chains: hub → x → y → z', () => {
        const m = D.buildRegionModel([loc('a', ['x']), loc('x', ['y']), loc('y'), loc('z', ['y'])], ['a']);
        assertEqual(regionOf(m, 'z'), 'a');
      });

      test('the nearer hub wins, even when it is listed later', () => {
        // a → p → q → x   (3 links)        b → x   (1 link)
        const ents = [loc('a', ['p']), loc('p', ['q']), loc('q', ['x']), loc('x'), loc('b', ['x'])];
        const m = D.buildRegionModel(ents, ['a', 'b']);
        assertEqual(regionOf(m, 'x'), 'b');
        assertEqual(regionOf(m, 'q'), 'a', 'q is 2 from a and 2 from b — tie, earlier region');
      });

      test('equally near two hubs → the earlier region', () => {
        const ents = [loc('a', ['x']), loc('b', ['x']), loc('x')];
        assertEqual(regionOf(D.buildRegionModel(ents, ['a', 'b']), 'x'), 'a');
        assertEqual(regionOf(D.buildRegionModel(ents, ['b', 'a']), 'x'), 'b');
      });

      test('two hubs linked directly each keep their own region', () => {
        const m = D.buildRegionModel([loc('a', ['b']), loc('b')], ['a', 'b']);
        assertEqual(regionOf(m, 'a'), 'a');
        assertEqual(regionOf(m, 'b'), 'b');
      });

      test('a link through an NPC does not connect two locations', () => {
        const ents = [loc('a', ['n']), npc('n', ['x']), loc('x', ['n'])];
        const m = D.buildRegionModel(ents, ['a']);
        assertEqual(regionOf(m, 'x'), undefined);
        assertEqual(m.orphans.map((e) => e.id).join(','), 'x');
      });

      test('a location nothing links to is an orphan, not lost', () => {
        const m = D.buildRegionModel([loc('a', ['x']), loc('x'), loc('island')], ['a']);
        assertEqual(m.orphans.length, 1);
        assertEqual(m.orphans[0].id, 'island');
      });

      test('related ids that do not exist are ignored', () => {
        const m = D.buildRegionModel([loc('a', ['ghost', 'x']), loc('x')], ['a']);
        assertEqual(regionOf(m, 'x'), 'a');
        assertEqual(m.orphans.length, 0);
      });

      test('a location that lists itself is harmless', () => {
        const m = D.buildRegionModel([loc('a', ['a', 'x']), loc('x', ['x'])], ['a']);
        assertEqual(regionOf(m, 'x'), 'a');
      });

      test('an entity with no related[] at all is handled', () => {
        const bare = { id: 'bare', name: 'Bare', type: 'location' };
        const m = D.buildRegionModel([loc('a'), bare], ['a']);
        assertEqual(m.orphans[0].id, 'bare');
      });

      test('visibility is ignored — a dm-only location still gets a region', () => {
        const ents = [loc('a', ['secret']), loc('secret', [], { visibility: 'dm-only' })];
        assertEqual(regionOf(D.buildRegionModel(ents, ['a']), 'secret'), 'a');
      });

      test('every location is either in a region or an orphan, never both', () => {
        const ents = [loc('a', ['x']), loc('x', ['y']), loc('y'), loc('b'), loc('i1'), loc('i2', ['i1']), npc('n', ['a'])];
        const m = D.buildRegionModel(ents, ['a', 'b']);
        const locs = ents.filter((e) => e.type === 'location');
        for (const e of locs) {
          const placed = m.regionOf.has(e.id), orphan = m.orphans.includes(e);
          assert(placed !== orphan, `${e.id}: placed=${placed} orphan=${orphan}`);
        }
        assertEqual(m.orphans.length, 2);
      });
    } // end D tests

    // ── state.js — party location ─────────────────────────────────────────────
    // state.js has replaced the mock App's state functions with the real ones.
    section('party location (state.js)');

    (function () {
      const A = window.App;
      const stored = () => JSON.parse(localStorage.getItem(window.CAMPAIGN.storageKey) || '{}');

      test('state.js loaded its functions onto App', () => {
        for (const fn of ['getPartyLocationId', 'getPartyLocation', 'setPartyLocation', 'setCurrentLocation']) {
          assert(typeof A[fn] === 'function', fn + ' missing');
        }
      });

      test('nothing set and nothing authored → no party location', () => {
        delete window.CAMPAIGN.partyLocation;
        assertEqual(A.getPartyLocationId(), null);
        assertEqual(A.getPartyLocation(), null);
      });

      test('campaign.json partyLocation is the default', () => {
        window.CAMPAIGN.partyLocation = 'loc_a';
        assertEqual(A.getPartyLocationId(), 'loc_a');
        assertEqual(A.getPartyLocation().name, 'Alpha Hall');
      });

      test('an authored default that is not a location resolves to nothing', () => {
        window.CAMPAIGN.partyLocation = 'known_npc';
        assertEqual(A.getPartyLocation(), null);
        window.CAMPAIGN.partyLocation = 'no_such_place';
        assertEqual(A.getPartyLocation(), null);
        window.CAMPAIGN.partyLocation = 'loc_a';
      });

      test('setPartyLocation moves the party AND the view, and persists both', () => {
        A.setPartyLocation('loc_b');
        assertEqual(A.getPartyLocationId(), 'loc_b', 'runtime value beats the authored default');
        assertEqual(A.getCurrentLocationId(), 'loc_b', 'the view follows the party');
        assertEqual(stored().partyLocationId, 'loc_b');
        assertEqual(stored().currentLocationId, 'loc_b');
      });

      test('setPartyLocation fires party:changed, then location:changed', () => {
        const seen = [];
        const onParty = (e) => seen.push('party:' + e.detail.id);
        const onLoc   = (e) => seen.push('location:' + e.detail.id);
        document.addEventListener('party:changed', onParty);
        document.addEventListener('location:changed', onLoc);
        A.setPartyLocation('loc_a');
        document.removeEventListener('party:changed', onParty);
        document.removeEventListener('location:changed', onLoc);
        assertEqual(seen.join(' '), 'party:loc_a location:loc_a');
      });

      test('looking elsewhere does not move the party', () => {
        A.setPartyLocation('loc_a');
        A.setCurrentLocation('loc_b');
        assertEqual(A.getCurrentLocationId(), 'loc_b');
        assertEqual(A.getPartyLocationId(), 'loc_a');
      });

      test('clearLocation (Home) leaves the party where it was', () => {
        A.clearLocation();
        assertEqual(A.getCurrentLocationId(), null);
        assertEqual(A.getPartyLocationId(), 'loc_a');
      });

      test('setPartyLocation with no id is ignored', () => {
        A.setPartyLocation('loc_b');
        A.setPartyLocation(null);
        A.setPartyLocation('');
        assertEqual(A.getPartyLocationId(), 'loc_b');
      });

      test('a stored id that no longer resolves falls back to the authored default', () => {
        window.CAMPAIGN.partyLocation = 'loc_a';
        A.setPartyLocation('renamed_since');
        assertEqual(A.getPartyLocation().id, 'loc_a');
      });

      test('a stored id that is not a location falls back too', () => {
        A.setPartyLocation('known_npc');
        assertEqual(A.getPartyLocation().id, 'loc_a');
        A.setPartyLocation('loc_b');
      });

      localStorage.removeItem(window.CAMPAIGN.storageKey);
    })();

    // ── Summary ───────────────────────────────────────────────────────────────
    const total = passes + failures;
    const sumEl = document.createElement('div');
    sumEl.className = 'summary ' + (failures ? 'dirty' : 'clean');
    sumEl.textContent = failures
      ? `${passes}/${total} passed   ${failures} FAILED`
      : `All ${total} tests passed.`;
    out.appendChild(sumEl);
  </script>
</body>
</html>
