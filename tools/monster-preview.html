<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monster Preview — TT Adventure Sessionbook</title>
<style>
/* ── Page chrome ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  padding: 1.5rem;
  background: #1a1a1a;
  font-family: Georgia, 'Palatino Linotype', Palatino, serif;
  color: #eee;
  min-height: 100vh;
}

h1.page-title {
  font-size: 1rem;
  font-weight: normal;
  color: #aaa;
  margin: 0 0 1rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.controls {
  display: flex;
  gap: 0.6rem;
  align-items: center;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

.controls input[type="search"] {
  flex: 1 1 260px;
  padding: 0.45rem 0.75rem;
  font-size: 0.9rem;
  font-family: inherit;
  border: 1px solid #444;
  border-radius: 4px;
  background: #2a2a2a;
  color: #eee;
  outline: none;
}
.controls input[type="search"]:focus { border-color: #9c2512; }

.controls select {
  padding: 0.45rem 0.75rem;
  font-size: 0.85rem;
  font-family: inherit;
  border: 1px solid #444;
  border-radius: 4px;
  background: #2a2a2a;
  color: #eee;
}

#suggestions {
  position: absolute;
  z-index: 100;
  background: #2a2a2a;
  border: 1px solid #555;
  border-top: none;
  border-radius: 0 0 4px 4px;
  max-height: 220px;
  overflow-y: auto;
  width: 300px;
}
#suggestions li {
  padding: 0.35rem 0.75rem;
  cursor: pointer;
  font-size: 0.85rem;
  list-style: none;
}
#suggestions li:hover, #suggestions li.active { background: #9c2512; color: #fff; }

.search-wrap { position: relative; flex: 1 1 260px; }

.status { color: #888; font-size: 0.85rem; font-style: italic; }

/* ── Stat block card ─────────────────────────────────────────────────────── */
.stat-block {
  background: #fdf1dc;
  color: #1a1a1a;
  max-width: 640px;
  border: 1px solid #c8a96e;
  box-shadow: 0 4px 18px rgba(0,0,0,0.55);
  font-family: Georgia, 'Palatino Linotype', Palatino, serif;
  font-size: 0.88rem;
  line-height: 1.45;
  position: relative;
}

/* top + bottom orange bars */
.stat-block::before, .stat-block::after {
  content: '';
  display: block;
  height: 7px;
  background: linear-gradient(to right, #8a1e0c, #c8390c, #8a1e0c);
}

.sb-inner { padding: 0.55rem 0.9rem 0.7rem; }

/* ── Header ──────────────────────────────────────────────────────────────── */
.sb-name {
  font-size: 1.65rem;
  font-weight: bold;
  color: #58180d;
  line-height: 1.1;
  margin: 0;
  text-transform: capitalize;
  letter-spacing: 0.01em;
}

.sb-meta {
  font-size: 0.82rem;
  font-style: italic;
  color: #333;
  margin: 0.15rem 0 0.4rem;
}

/* ── Section dividers ────────────────────────────────────────────────────── */
.sb-rule {
  border: none;
  border-top: 1px solid #9c2512;
  margin: 0.45rem 0;
}
.sb-rule-heavy {
  border: none;
  border-top: 2px solid #9c2512;
  margin: 0.6rem 0;
}

/* ── Basics (AC / HP / Speed) ────────────────────────────────────────────── */
.sb-basics p {
  margin: 0.1rem 0;
  font-size: 0.88rem;
}
.sb-basics .label { color: #58180d; font-weight: bold; }

/* ── Ability scores ──────────────────────────────────────────────────────── */
.sb-abilities {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  text-align: center;
  font-size: 0.82rem;
  margin: 0.3rem 0;
  gap: 0.1rem;
}
.sb-ability .score-label {
  font-weight: bold;
  color: #58180d;
  font-size: 0.7rem;
  text-transform: uppercase;
  display: block;
}
.sb-ability .score-val { display: block; }
.sb-ability .score-mod { display: block; font-size: 0.78rem; }

/* ── Details (saves, skills, resistances, senses, CR) ───────────────────── */
.sb-details p {
  margin: 0.12rem 0;
  font-size: 0.85rem;
}
.sb-details .label { color: #58180d; font-weight: bold; }
.sb-cr-row {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
}

/* ── Section headers (Traits, Actions, etc.) ─────────────────────────────── */
.sb-section-title {
  font-size: 1.05rem;
  color: #58180d;
  font-weight: bold;
  margin: 0.55rem 0 0.2rem;
  border-bottom: 1px solid #9c2512;
  padding-bottom: 0.1rem;
}

/* ── Traits / Actions / Reactions / Legendary ───────────────────────────── */
p.sb-entry {
  margin: 0.3rem 0;
  font-size: 0.86rem;
  line-height: 1.5;
}
div.sb-entry {
  margin: 0.3rem 0;
  font-size: 0.86rem;
  line-height: 1.5;
}
.sb-entry-name {
  font-weight: bold;
  font-style: italic;
}
.sb-entry-name::after { content: '.'; }

/* spellcasting nested lists */
.sb-spell-list {
  margin: 0.15rem 0 0.15rem 1rem;
  padding: 0;
  list-style: none;
  font-size: 0.84rem;
}
.sb-spell-slot-label { color: #58180d; font-weight: bold; }

/* legendary action intro */
.sb-legendary-intro {
  font-size: 0.85rem;
  margin: 0.3rem 0 0.45rem;
  font-style: italic;
  color: #333;
}

/* ── Description / Lore ──────────────────────────────────────────────────── */
.sb-lore {
  background: #fdf8ef;
  border-top: 2px solid #9c2512;
  padding: 0.6rem 0.9rem 0.7rem;
  font-size: 0.84rem;
  line-height: 1.55;
}
.sb-lore p { margin: 0.35rem 0; }
.sb-lore .lore-header {
  font-weight: bold;
  font-style: italic;
  display: block;
  margin-top: 0.5rem;
  color: #222;
}

/* source footer */
.sb-source {
  font-size: 0.72rem;
  color: #888;
  text-align: right;
  margin-top: 0.35rem;
  padding: 0.2rem 0.9rem 0.4rem;
  background: #fdf1dc;
  border-top: 1px solid #e0c9a0;
}
</style>
</head>
<body>
<h1 class="page-title">Monster Preview — dev tool</h1>

<div class="controls">
  <div class="search-wrap">
    <input type="search" id="monster-search" placeholder="Search monsters…" autocomplete="off">
    <ul id="suggestions" hidden></ul>
  </div>
  <span class="status" id="status">Loading…</span>
</div>

<div id="output"></div>

<script>
// ── Tag renderer (5etools entry syntax → readable HTML) ───────────────────

const ABILITY_NAMES = { str:'Strength', dex:'Dexterity', con:'Constitution', int:'Intelligence', wis:'Wisdom', cha:'Charisma' };

function renderTag(tag, content) {
  const parts = content.split('|');
  const main  = parts[0].trim();

  switch (tag) {
    // Attack types (2014 format)
    case 'atk': {
      const map = { mw:'Melee Weapon Attack', rw:'Ranged Weapon Attack', ms:'Melee Spell Attack', rs:'Ranged Spell Attack' };
      const types = main.split(',').map(k => map[k.trim()] || k);
      const unique = [...new Set(types)];
      return `<em>${unique.join(' or ')}:</em>`;
    }
    // Attack types (2024 format) — {@atkr m} / {@atkr r} / {@atkr m,r}
    case 'atkr': {
      const map2 = { m:'Melee Attack Roll', r:'Ranged Attack Roll' };
      const types2 = main.split(',').map(k => map2[k.trim()] || k);
      const unique2 = [...new Set(types2)];
      return `<em>${unique2.join(' or ')}:</em>`;
    }
    // Saving throws (2014)
    case 'dc':      return `DC ${main}`;
    // Saving throws (2024)
    case 'actSave': {
      const abl = ABILITY_NAMES[main.toLowerCase()] || main;
      return `<strong>${abl} Saving Throw:</strong>`;
    }
    case 'actSaveFail':          return `<strong>Failure:</strong>`;
    case 'actSaveSuccess':       return `<strong>Success:</strong>`;
    case 'actSaveSuccessOrFail': return `<strong>Effect:</strong>`;
    // Hit / damage
    case 'hit':    return `+${main} to hit`;
    case 'h':      return '<strong>Hit:</strong>';
    case 'damage': return main;
    case 'dice':   return main;
    // Recharge
    case 'recharge': return main === '6' ? '(Recharge 6)' : `(Recharge ${main}–6)`;
    // Text styling
    case 'i':  return `<em>${main}</em>`;
    case 'b':  return `<strong>${main}</strong>`;
    // Linked terms — show display text only (strip source pipe)
    case 'spell':       return `<em>${main}</em>`;
    case 'condition':   return `<em>${main}</em>`;
    case 'status':      return `<em>${main}</em>`;
    case 'skill':       return main;
    case 'sense':       return main;
    case 'language':    return main;
    case 'item':        return main;
    case 'creature':    return main;
    case 'variantrule': return main;
    case 'action':      return main;
    case 'feat':        return main;
    case 'race':        return main;
    case 'class':       return main;
    case 'table':       return main;
    // Area of effect (embedded label references)
    case 'area':   return main;
    case 'filter': return main;
    case 'note':   return '';   // editorial notes — omit from display
    default:       return main; // unknown tags: show first segment
  }
}

function renderText(str) {
  if (!str) return '';
  // Replace {@tag content} with rendered HTML
  return str.replace(/\{@(\w+)([^}]*)\}/g, (_, tag, rest) => {
    const content = rest.trimStart();
    return renderTag(tag, content);
  });
}

function renderEntries(entries) {
  if (!entries) return '';
  return entries.map(e => {
    if (typeof e === 'string') return `<p style="margin:0.15rem 0">${renderText(e)}</p>`;
    if (typeof e !== 'object') return '';
    switch (e.type) {
      case 'entries':
        return `<p style="margin:0.15rem 0"><strong>${renderText(e.name || '')}</strong> ${renderEntries(e.entries)}</p>`;
      case 'list':
        return `<ul style="margin:0.15rem 0 0.15rem 1.2rem">${(e.items||[]).map(i => `<li>${typeof i==='string'?renderText(i):renderEntries(i.entries||[])}</li>`).join('')}</ul>`;
      case 'table':
        return ''; // omit tables in this view
      case 'inset': case 'quote':
        return `<blockquote style="margin:0.3rem 0 0.3rem 0.8rem;border-left:3px solid #9c2512;padding-left:0.5rem;font-style:italic">${renderEntries(e.entries)}</blockquote>`;
      default:
        if (e.entries) return renderEntries(e.entries);
        return '';
    }
  }).join('');
}

// ── Data helpers ──────────────────────────────────────────────────────────

const SIZES = { T:'Tiny', S:'Small', M:'Medium', L:'Large', H:'Huge', G:'Gargantuan' };

const LAW  = { L:'Lawful', N:'Neutral', C:'Chaotic' };
const GOOD = { G:'Good',   N:'Neutral', E:'Evil' };

function fmtAlignment(arr) {
  if (!arr || !arr.length) return 'Unaligned';
  if (arr.includes('U') || arr.length === 0) return 'Unaligned';
  if (arr.includes('A')) return 'Any Alignment';
  if (arr.length === 1 && arr[0] === 'N') return 'Neutral';
  if (arr.length === 2) {
    const l = LAW[arr[0]], g = GOOD[arr[1]];
    if (l && g) return `${l} ${g}`;
  }
  // Handle unaligned / non-standard combos gracefully
  return arr.join(' ');
}

function fmtType(type) {
  if (!type) return '';
  if (typeof type === 'string') return cap(type);
  const base = cap(type.type || '');
  const tags = type.tags ? ` (${type.tags.join(', ')})` : '';
  const swarm = type.swarmSize ? ` swarm of ${SIZES[type.swarmSize]||type.swarmSize} ${base}s` : '';
  return swarm || (base + tags);
}

function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : ''; }

function abilMod(score) {
  const m = Math.floor((score - 10) / 2);
  return m >= 0 ? `+${m}` : `${m}`;
}

function fmtAC(ac) {
  if (!ac || !ac.length) return '–';
  const entry = ac[0];
  if (typeof entry === 'number') return `${entry}`;
  const base = entry.ac;
  const from = (entry.from || []).join(', ');
  const cond = entry.condition ? ` ${entry.condition}` : '';
  return from ? `${base} (${from})${cond}` : `${base}${cond}`;
}

function fmtHP(hp) {
  if (!hp) return '–';
  return hp.special || `${hp.average} (${hp.formula})`;
}

function fmtSpeed(speed) {
  if (!speed) return '–';
  const ORDER = ['walk', 'burrow', 'climb', 'fly', 'swim'];
  const parts = [];
  for (const key of ORDER) {
    if (!speed[key]) continue;
    const val = speed[key];
    const num = typeof val === 'object' ? val.number : val;
    const cond = typeof val === 'object' && val.condition ? ` (${val.condition})` : '';
    const hover = typeof speed.canHover === 'boolean' && key === 'fly' && speed.canHover ? ' (hover)' : '';
    const label = key === 'walk' ? '' : cap(key) + ' ';
    parts.push(`${label}${num} ft.${hover}${cond}`);
  }
  return parts.join(', ') || '–';
}

const CR_XP = {
  '0':5,'1/8':25,'1/4':50,'1/2':100,
  '1':200,'2':450,'3':700,'4':1100,'5':1800,'6':2300,'7':2900,'8':3900,
  '9':5000,'10':5900,'11':7200,'12':8400,'13':10000,'14':11500,'15':13000,
  '16':15000,'17':18000,'18':20000,'19':22000,'20':25000,
  '21':33000,'22':41000,'23':50000,'24':62000,'25':75000,
  '26':90000,'27':105000,'28':120000,'29':135000,'30':155000,
};
function fmtCR(cr) {
  const val = typeof cr === 'object' ? cr.cr : cr;
  if (!val && val !== '0') return '–';
  const xp = CR_XP[val];
  const xpStr = xp != null ? ` (${xp.toLocaleString()} XP` : ' (';
  const lairXp = typeof cr === 'object' && cr.xpLair ? `; ${cr.xpLair.toLocaleString()} XP in Lair)` : ')';
  return `${val}${xpStr}${lairXp}`;
}

function fmtProfBonus(cr) {
  const val = typeof cr === 'object' ? cr.cr : cr;
  const n = val === '1/8'||val==='1/4'||val==='1/2'||val==='0' ? 0 : parseInt(val, 10);
  const prof = Math.max(2, Math.ceil(n / 4) + 1);
  return `+${prof}`;
}

function listStr(arr) {
  if (!arr || !arr.length) return '';
  return arr.map(s => typeof s === 'string' ? s : s.name || '').join(', ');
}

// ── Spellcasting renderer ─────────────────────────────────────────────────

const SLOT_LABEL = { '0':'Cantrips (at will)', '1':'1st level','2':'2nd level','3':'3rd level',
  '4':'4th level','5':'5th level','6':'6th level','7':'7th level','8':'8th level','9':'9th level' };

function renderSpellcasting(sc) {
  const lines = [];
  if (sc.headerEntries) {
    lines.push(`<div class="sb-entry"><span class="sb-entry-name">${renderText(sc.name||'Spellcasting')}</span> ${renderEntries(sc.headerEntries)}</div>`);
  } else {
    lines.push(`<div class="sb-entry"><span class="sb-entry-name">${renderText(sc.name||'Spellcasting')}</span></div>`);
  }
  const ul = ['<ul class="sb-spell-list">'];
  if (sc.constant)   ul.push(`<li><span class="sb-spell-slot-label">Constant:</span> ${sc.constant.map(s=>renderText(s)).join(', ')}</li>`);
  if (sc.will)       ul.push(`<li><span class="sb-spell-slot-label">At Will:</span> ${sc.will.map(s=>renderText(s)).join(', ')}</li>`);
  if (sc.ritual)     ul.push(`<li><span class="sb-spell-slot-label">Rituals:</span> ${sc.ritual.map(s=>renderText(s)).join(', ')}</li>`);
  if (sc.daily) {
    for (const [times, spells] of Object.entries(sc.daily)) {
      const label = times.endsWith('e') ? `${times.replace('e','')}/${times.replace('e','')} each` : `${times}/Day`;
      ul.push(`<li><span class="sb-spell-slot-label">${label}:</span> ${spells.map(s=>renderText(s)).join(', ')}</li>`);
    }
  }
  if (sc.spells) {
    for (const [level, data] of Object.entries(sc.spells)) {
      const label = SLOT_LABEL[level] || `${level}th level`;
      const slots = data.slots ? ` (${data.slots} slot${data.slots>1?'s':''})` : '';
      const spells = (data.spells||[]).map(s=>renderText(s)).join(', ');
      ul.push(`<li><span class="sb-spell-slot-label">${label}${slots}:</span> ${spells}</li>`);
    }
  }
  if (sc.footerEntries) {
    ul.push(`<li><em>${renderEntries(sc.footerEntries)}</em></li>`);
  }
  ul.push('</ul>');
  lines.push(ul.join(''));
  return lines.join('');
}

// ── Main render ───────────────────────────────────────────────────────────

function buildStatBlock(m) {
  const size      = (m.size||[]).map(s=>SIZES[s]||s).join('/');
  const type      = fmtType(m.type);
  const alignment = fmtAlignment(m.alignment);
  const meta      = [size, type].filter(Boolean).join(' ') + ', ' + alignment;

  // Detail rows
  const details = [];
  if (m.save && Object.keys(m.save).length) {
    const saves = Object.entries(m.save).map(([k,v])=>`${cap(k)} ${v}`).join(', ');
    details.push(`<p><span class="label">Saving Throws</span> ${saves}</p>`);
  }
  if (m.skill && Object.keys(m.skill).length) {
    const skills = Object.entries(m.skill).map(([k,v])=>`${cap(k)} ${v}`).join(', ');
    details.push(`<p><span class="label">Skills</span> ${skills}</p>`);
  }
  if (m.vulnerable && m.vulnerable.length)       details.push(`<p><span class="label">Damage Vulnerabilities</span> ${listStr(m.vulnerable)}</p>`);
  if (m.resist && m.resist.length)               details.push(`<p><span class="label">Damage Resistances</span> ${listStr(m.resist)}</p>`);
  if (m.immune && m.immune.length)               details.push(`<p><span class="label">Damage Immunities</span> ${listStr(m.immune)}</p>`);
  if (m.conditionImmune && m.conditionImmune.length) details.push(`<p><span class="label">Condition Immunities</span> ${listStr(m.conditionImmune)}</p>`);
  const sensesStr = [...(m.senses||[]), `Passive Perception ${m.passive||10}`].join(', ');
  details.push(`<p><span class="label">Senses</span> ${sensesStr}</p>`);
  const langsStr = (m.languages||[]).join(', ') || '—';
  details.push(`<p><span class="label">Languages</span> ${langsStr}</p>`);

  // Traits section — name span must be inline with the first text paragraph
  function renderSection(title, entries) {
    if (!entries || !entries.length) return '';
    const items = entries.map(e => {
      if (e.type === 'spellcasting') return renderSpellcasting(e);
      const nameHtml = e.name ? `<span class="sb-entry-name">${renderText(e.name)}</span> ` : '';
      const textEntries = e.entries || [];
      if (!textEntries.length) return `<p class="sb-entry">${nameHtml}</p>`;
      return textEntries.map((te, idx) => {
        if (typeof te === 'string') {
          // Inline name with first paragraph so bold-italic name sits on same line as text
          const prefix = idx === 0 ? nameHtml : '';
          return `<p class="sb-entry">${prefix}${renderText(te)}</p>`;
        }
        // Non-string sub-entries (lists, nested entries)
        const prefix = idx === 0 ? nameHtml : '';
        return `<div class="sb-entry">${prefix}${renderEntries([te])}</div>`;
      }).join('');
    }).join('');
    return title ? `<div class="sb-section-title">${title}</div>${items}` : items;
  }

  // Legendary action intro
  const legActions = m.legendaryActionsLair != null ? m.legendaryActionsLair : 3;
  const legIntro = m.legendary && m.legendary.length
    ? `<p class="sb-legendary-intro">The ${(typeof m.type==='string'?m.type:m.type?.type)||'creature'} can take ${legActions} legendary action${legActions!==1?'s':''}, choosing from the options below. Only one legendary action option can be used at a time and only at the end of another creature's turn. The ${(typeof m.type==='string'?m.type:m.type?.type)||'creature'} regains spent legendary actions at the start of its turn.</p>`
    : '';

  // Description / lore
  let loreHtml = '';
  if (m.description && m.description.length) {
    const paras = m.description.map(d => {
      // {@i Text} at start of entry = flavor header
      const headerMatch = d.match(/^\{@i ([^}]+)\}$/);
      if (headerMatch) return `<span class="lore-header">${headerMatch[1]}</span>`;
      return `<p>${renderText(d)}</p>`;
    }).join('');
    loreHtml = `<div class="sb-lore">${paras}</div>`;
  }

  const sourceLabel = m.page ? `${m.source} p.${m.page}` : m.source;

  return `
<div class="stat-block">
  <div class="sb-inner">
    <h2 class="sb-name">${m.name}</h2>
    <p class="sb-meta">${meta}</p>

    <hr class="sb-rule">
    <div class="sb-basics">
      <p><span class="label">Armor Class</span> ${fmtAC(m.ac)}</p>
      <p><span class="label">Hit Points</span> ${fmtHP(m.hp)}</p>
      <p><span class="label">Speed</span> ${fmtSpeed(m.speed)}</p>
    </div>

    <hr class="sb-rule">
    <div class="sb-abilities">
      ${['str','dex','con','int','wis','cha'].map(a => `
        <div class="sb-ability">
          <span class="score-label">${a.toUpperCase()}</span>
          <span class="score-val">${m[a]??'–'}</span>
          <span class="score-mod">(${abilMod(m[a]??10)})</span>
        </div>`).join('')}
    </div>

    <hr class="sb-rule">
    <div class="sb-details">
      ${details.join('')}
      <div class="sb-cr-row">
        <p><span class="label">Challenge</span> ${fmtCR(m.cr)}</p>
        <p><span class="label">Proficiency Bonus</span> ${fmtProfBonus(m.cr)}</p>
      </div>
    </div>

    ${m.trait && m.trait.length ? `<hr class="sb-rule">${renderSection('Traits', m.trait)}` : ''}
    ${m.action && m.action.length ? `<hr class="sb-rule">${renderSection('Actions', m.action)}` : ''}
    ${m.bonus && m.bonus.length ? `<hr class="sb-rule">${renderSection('Bonus Actions', m.bonus)}` : ''}
    ${m.reaction && m.reaction.length ? `<hr class="sb-rule">${renderSection('Reactions', m.reaction)}` : ''}
    ${m.legendary && m.legendary.length ? `<hr class="sb-rule"><div class="sb-section-title">Legendary Actions</div>${legIntro}${renderSection('', m.legendary)}` : ''}
    ${m.mythic && m.mythic.length ? `<hr class="sb-rule">${renderSection('Mythic Actions', m.mythic)}` : ''}
  </div>

  ${loreHtml}
  <div class="sb-source">${sourceLabel}</div>
</div>`;
}

// ── Data loading + search ─────────────────────────────────────────────────

let allMonsters = [];

async function load() {
  const status = document.getElementById('status');
  try {
    // Resolve path relative to root regardless of where this file lives
    const resp = await fetch('../campaigns/fail-academy/data/monsters-raw.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    allMonsters = await resp.json();
    status.textContent = `${allMonsters.length.toLocaleString()} monsters loaded`;
    setupSearch();
    showMonster(allMonsters.find(m => m.name === 'Aboleth') || allMonsters[0]);
  } catch (e) {
    status.textContent = `Error: ${e.message} — run via start-map.bat, not file://`;
  }
}

function showMonster(m) {
  document.getElementById('output').innerHTML = buildStatBlock(m);
  document.getElementById('monster-search').value = m.name;
}

function setupSearch() {
  const input = document.getElementById('monster-search');
  const list  = document.getElementById('suggestions');
  let activeSuggestion = -1;

  function updateSuggestions(query) {
    const q = query.toLowerCase().trim();
    list.innerHTML = '';
    activeSuggestion = -1;
    if (!q) { list.hidden = true; return; }
    const matches = allMonsters.filter(m => m.name.toLowerCase().includes(q)).slice(0, 12);
    if (!matches.length) { list.hidden = true; return; }
    matches.forEach((m, i) => {
      const li = document.createElement('li');
      li.textContent = `${m.name} (${m.source})`;
      li.addEventListener('mousedown', () => {
        showMonster(m);
        list.hidden = true;
      });
      list.appendChild(li);
    });
    list.hidden = false;
  }

  input.addEventListener('input', e => updateSuggestions(e.target.value));

  input.addEventListener('keydown', e => {
    const items = list.querySelectorAll('li');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeSuggestion = Math.min(activeSuggestion + 1, items.length - 1);
      items.forEach((li, i) => li.classList.toggle('active', i === activeSuggestion));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeSuggestion = Math.max(activeSuggestion - 1, 0);
      items.forEach((li, i) => li.classList.toggle('active', i === activeSuggestion));
    } else if (e.key === 'Enter') {
      if (activeSuggestion >= 0 && items[activeSuggestion]) {
        items[activeSuggestion].dispatchEvent(new Event('mousedown'));
      }
    } else if (e.key === 'Escape') {
      list.hidden = true;
    }
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) list.hidden = true;
  });
}

load();
</script>
